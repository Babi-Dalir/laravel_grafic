name: CD-Liara

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: update-liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npx @liara/cli@9 deploy --app=amazing-jennings-gic1pmrib --port=3000 --api-token="$LIARA_TOKEN" --detach
